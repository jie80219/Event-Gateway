version: '3'

services:
  # 1. Anser Gateway (你的 Event-Gateway 本體)
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app/app
      - ./system:/app/system
      - ./worker:/app/worker
      # 掛載 supervisor 設定以啟動 Event Consumer
      - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    environment:
      - LEGACY_WORKER=true
    networks:
      - backend
    depends_on:
      - redis
      - rabbitmq
      - consul

  # 2. Redis (用於 Saga 狀態儲存與 Gateway 快取)
  redis:
    image: redis:alpine
    container_name: event-redis
    ports:
      - "6379:6379"
    networks:
      - backend

  # 3. RabbitMQ (用於 EDA 事件傳遞)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: event-rabbitmq
    ports:
      - "5672:5672"   # AMQP 協定端口 (程式連線用)
      - "15672:15672" # 管理介面 (瀏覽器用)
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - backend

  # 4. Consul (用於服務發現，維持 Anser-Gateway 原有功能)
  consul:
    image: consul:1.14.4 # 使用具體版本號
    container_name: event-consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - backend

networks:
  backend:
    driver: bridge
    external: true